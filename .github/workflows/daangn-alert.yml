name: 당근마켓 신규 매물 알림

# 실행 방식:
#  - GitHub 스케줄러(cron)로 30분마다 1회 실행한다(단발성 점검).
#    · 예전에는 한 job 안에서 몇 분 간격으로 최대 5.5시간을 도는 폴링 루프였는데,
#      실행 시간이 지나치게 길어 이를 없애고 매 실행이 짧게 끝나도록 바꿨다.
#  - 각 실행은 config/watches.json 을 한 번 점검하고 알림/상태 커밋 후 종료한다.
#  - GitHub 스케줄러는 부하 시 지연·누락될 수 있으나, 30분마다 실행이라 다음 주기가 이어받는다.
#  - 같은 매물은 하루(한국시간)에 1회만 알린다(매일 1회 리마인더): 계속 노출되면 매일
#    한 번 다시 알림받고, 같은 날 여러 번 실행돼도 중복 알림은 없다(state/seen.json 이
#    매물별 '마지막으로 알린 날짜'를 기록).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '이메일/이슈를 실제로 보내지 않고 로그만 출력'
        type: boolean
        default: false
      debug:
        description: '파싱 진단 로그 출력(DEBUG)'
        type: boolean
        default: false

# state/seen.json 커밋(contents) 및 이슈 생성(issues) 권한 필요
permissions:
  contents: write
  issues: write

# 겹쳐 실행되지 않도록: 새 런이 시작되면 진행 중인 이전 런을 취소
concurrency:
  group: daangn-alert
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 단발성 점검이라 짧게 끝난다. 네트워크 지연 등에 대비한 넉넉한 상한.
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정 (npm 캐시 사용)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package-lock.json

      - name: 의존성 설치
        working-directory: scripts
        run: npm ci --no-audit --no-fund

      - name: 점검 (검색 · 알림 · 상태 커밋)
        env:
          GMAIL_USER: ${{ vars.GMAIL_USER || secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          CHAT_HELPER_URL: ${{ vars.CHAT_HELPER_URL }}
          # (선택) 당근 내 동네 매물 수집용 로그인 세션 쿠키. 없으면 당근은 기본지역(서초4동)만.
          DAANGN_COOKIE: ${{ secrets.DAANGN_COOKIE }}
          # 이슈 등록용 (Actions 가 자동 제공하는 토큰/저장소명)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          DEBUG: ${{ github.event.inputs.debug }}
          # 검색(네트워크 대기)을 몇 개까지 동시에 수행할지. 너무 높이면 사이트가 429/403 을 줄 수 있다.
          SEARCH_CONCURRENCY: '4'
        run: |
          set +e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "▶ 점검 시작 · $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          ( cd scripts && node check_daangn.js )
          CHECK_STATUS=$?
          if [ "$CHECK_STATUS" -ne 0 ]; then
            echo "::error::검색 또는 알림 발송에 실패했습니다. 위 오류 로그와 저장소 Secrets를 확인하세요."
          fi

          # DRY_RUN 이 아니고 상태가 바뀌었으면 seen.json 커밋/푸시.
          # 상태 push 가 실패하면 이미 알린 매물을 다음 실행에서 다시 알릴 수 있으므로
          # (중복 알림) 몇 번 재시도해 저장 성공 확률을 높인다.
          if [ "${DRY_RUN}" != "true" ] && [ -n "$(git status --porcelain state/)" ]; then
            git add state/seen.json
            git commit -m "chore: 감시 상태(seen.json) 업데이트 [skip ci]" >/dev/null 2>&1 || true
            pushed=0
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
              if git push origin "HEAD:${GITHUB_REF_NAME}" 2>/dev/null; then pushed=1; break; fi
              echo "  (상태 push 재시도 ${attempt}/3)"
              sleep 3
            done
            [ "$pushed" = 1 ] || echo "::warning::상태(seen.json) push 실패 — 다음 실행에 재시도(중복 알림 가능)"
          fi

          exit "$CHECK_STATUS"
