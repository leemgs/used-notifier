<body>
  <header class="hero">
    <div class="wrap">
      <h1>💬 빠른 채팅 도우미</h1>
      <p class="tagline">인사말을 복사하고, 매물로 이동해 "채팅하기"에 붙여넣으세요.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2 id="item-title">매물</h2>

      <h3>1. 인사말 복사</h3>
      <div class="chat-msg" id="chat-msg">안녕하세요. 제가 구매 가능할까요?</div>
      <button id="copy-btn" type="button">📋 인사말 복사</button>

      <h3>2. 매물로 이동해 채팅하기</h3>
      <p class="hint" id="open-hint">
        아래 버튼을 누르면 매물이 열립니다.
        <b>"채팅하기"</b>를 누른 뒤 방금 복사한 인사말을 붙여넣고 전송하세요.
      </p>
      <a id="open-item" class="button-link" href="#" target="_blank" rel="noopener">
        매물에서 채팅하기 →
      </a>

      <p class="hint" id="fallback-note" style="margin-top:18px;">
        (자동 안전정책 안내) 계정 보호와 각 사이트 이용약관 준수를 위해
        메시지 전송은 마지막에 <b>직접</b> 눌러 완료합니다.
      </p>
    </section>
  </main>

  <footer class="wrap">
    <p><a href="./index.html">← 알림 설정 홈으로</a></p>
